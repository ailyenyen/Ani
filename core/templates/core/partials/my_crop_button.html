{% load ani_tags %}{% if saved %}<a class="btn btn-soft btn-small my-crop-btn is-saved" href="{% url 'my_crops' %}" title="Open My Crops">{% icon 'check' 16 %}In My Crops</a>
{% elif current_user %}<form class="inline-form" method="post" action="{% url 'my_crops_add' %}">{% csrf_token %}<input type="hidden" name="crop" value="{{ crop_slug }}"><input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="btn {{ style|default:'btn-secondary' }} btn-small my-crop-btn" type="submit">{% icon 'plus' 16 %}Add to My Crops</button></form>
{% else %}<a class="btn {{ style|default:'btn-secondary' }} btn-small my-crop-btn" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">{% icon 'plus' 16 %}Add to My Crops</a>{% endif %}
