{% load ani_tags %}<a class="btn {{ style|default:'btn-primary' }} btn-small alert-btn" href="{% url 'alert_new' %}?crop={{ crop_slug|urlencode }}" data-alert-open data-crop="{{ crop_slug }}" data-name="{{ crop_name }}" data-price="{{ price|default_if_none:'' }}" data-low="{{ low|default_if_none:'' }}" data-high="{{ high|default_if_none:'' }}" data-price-label="{{ price_label|default:'Now' }}">{% icon 'bell' 16 %}{{ label|default:"Set price alert" }}</a>
