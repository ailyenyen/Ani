{% load static %}<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ani shows crop prices from DA Bantay Presyo, Kadiwa and local markets in one place. Better Prices. Stronger Farmers.">
  <meta name="theme-color" content="#F7F5EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1A15" media="(prefers-color-scheme: dark)">
  <script>
    /* Apply the saved theme and menu state before the page is drawn, so nothing flashes. */
    (function () {
      var root = document.documentElement, theme = "light";
      try {
        theme = localStorage.getItem("ani-theme") ||
          (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (localStorage.getItem("ani-sidebar") === "collapsed") root.classList.add("sidebar-collapsed");
      } catch (e) {}
      root.setAttribute("data-theme", theme);
      root.classList.add("js");
    })();
  </script>
  <link rel="icon" href="{% static 'core/img/logo-mark.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'core/css/ani.css' %}?v=compact-feature-1">
